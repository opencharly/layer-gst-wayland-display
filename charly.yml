gst-wayland-display:
    candy:
        description: |
            Builds and installs the gst-wayland-display GStreamer plugin —
            `libgstwaylanddisplaysrc.so`, the `waylanddisplaysrc` element that IS the
            Wayland parent for a nested compositor. The element embeds a Smithay
            compositor, creates `zwp_linux_dmabuf_v1` on a real DRM render node, and
            produces GStreamer buffers straight out of the compositor — which is what
            lets a nested Hyprland run with no seat, no KMS device and no DRM master.

            Built from the opencharly fork at a pinned commit rather than from crates.io:
            the fork carries the resize sentinel fix (an unset `max_size` intersected to
            `None`, so a resize silently snapped to 1280x720), the xkb-layout/variant/
            options element properties, and smooth-scroll axis support. Upstream has
            none of these.

            The source is fetched at an immutable commit tarball, built with cargo, and
            only the resulting .so is installed — the build tree is removed in the same
            step. Every claim below is checkable in a disposable build-scope container:
            the plugin file exists, GStreamer loads it, the element is registered, and
            the three keymap properties the streamer sets are present.
        package:
            - rust
            - gstreamer
            - gst-plugins-base
            - gst-plugin-va
            - wayland
            - libinput
            - libxkbcommon
            - mesa
            - clang
            - pkgconf
            - curl
        distro:
            arch:
                package:
                    - base-devel
            cachyos:
                package:
                    - base-devel
        plan:
            - run: fetch the pinned gst-wayland-display fork tarball
              download: "https://github.com/opencharly/gst-wayland-display/archive/d1bd382bce22395d0460e78c57313cc98ddc3877.tar.gz"
              extract: tar.gz
              to: /tmp/gwd-src
              run_as: root
            - run: build the plugin and install only the .so, then drop the build tree
              command: |
                # `set -e` WITHOUT `-u`: the two env vars below are legitimately unset in
                # a build container, and the brace-default form that would guard them is
                # the one charly reserves for its own runtime variables.
                set -e
                cd /tmp/gwd-src/gst-wayland-display-d1bd382bce22395d0460e78c57313cc98ddc3877
                cargo build --release -p gst-plugin-wayland-display
                install -Dm755 target/release/libgstwaylanddisplaysrc.so \
                  /usr/lib/gstreamer-1.0/libgstwaylanddisplaysrc.so
                cd /
                rm -rf /tmp/gwd-src ~/.cargo/registry ~/.cargo/git
              run_as: root
            - check: the gst-wayland-display plugin file is installed
              id: gwd-so-installed
              file:
                file: /usr/lib/gstreamer-1.0/libgstwaylanddisplaysrc.so
                exists: true
            - check: GStreamer loads the plugin and registers the waylanddisplaysrc element
              id: gwd-element-registered
              exit_status: 0
              command: gst-inspect-1.0 waylanddisplaysrc
              stdout:
                - contains: "Wayland display source"
            - check: the fork's keymap properties are present — the streamer sets all three
              id: gwd-keymap-properties
              exit_status: 0
              command: gst-inspect-1.0 waylanddisplaysrc
              stdout:
                - contains: xkb-layout
                - contains: xkb-variant
                - contains: xkb-options
            - check: a waylanddisplaysrc pipeline negotiates DMABuf into vapostproc and reaches PLAYING
              id: gwd-dmabuf-negotiates
              exit_status: 0
              context:
                - runtime
              command: |
                # `set -e` WITHOUT `-u`: the two env vars below are legitimately unset in
                # a build container, and the brace-default form that would guard them is
                # the one charly reserves for its own runtime variables.
                set -e
                # The DMABuf caps filter is the load-bearing part. Without it the source
                # may negotiate system memory and the whole chain silently becomes a CPU
                # copy that still "works" -- so this asserts the zero-copy path itself,
                # not merely that a pipeline ran.
                # No brace-default syntax here: charly parses a dollar-brace in a
                # command as its OWN runtime variable and, finding no binding, SKIPS
                # the check. A skip reads as "not failed", so the gate would silently
                # stop gating. Plain [ -z ] assignment avoids the brace form entirely.
                if [ -z "$XDG_RUNTIME_DIR" ]; then XDG_RUNTIME_DIR=/tmp/gwd-gate-rt; fi
                export XDG_RUNTIME_DIR
                mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
                node="$CSTREAM_RENDER_NODE"
                if [ -z "$node" ]; then node=/dev/dri/renderD128; fi
                # A missing render node FAILS rather than skipping. cstream has no
                # software fallback -- GWD creates zwp_linux_dmabuf_v1 only on the
                # hardware path -- so an absent node is a configuration error, and a
                # skip here would let the zero-copy claim go ungated.
                if [ ! -e "$node" ]; then
                    echo "GWD-DMABUF-FAIL: no render node at $node"; exit 1
                fi
                timeout 30 gst-launch-1.0 -q waylanddisplaysrc render-node="$node" num-buffers=30 \
                  ! "video/x-raw(memory:DMABuf),width=1920,height=1080,framerate=60/1" \
                  ! vapostproc ! fakesink
                echo GWD-DMABUF-OK
              stdout:
                - contains: GWD-DMABUF-OK
            - check: the render-node property is present — the element never uses a software node
              id: gwd-render-node-property
              exit_status: 0
              command: gst-inspect-1.0 waylanddisplaysrc
              stdout:
                - contains: render-node
